{% extends 'base.html' %}

{% block content %}
<style>
    /* Custom Styling for the PixelGram Look */
    .auth-container {
        margin-top: 3rem;
    }

    .auth-card {
        border: 1px solid #dbdbdb;
        border-radius: 1px;
        /* Instagram-style sharp edges or very slight round */
        padding: 20px;
        background-color: #fff;
    }

    .brand-logo {
        font-family: 'Grand Hotel', cursive;
        font-size: 3.5rem;
        color: #262626;
        margin-bottom: 0.5rem;
    }

    /* Styling Django Form Inputs */
    form input {
        width: 100%;
        padding: 9px 7px;
        margin-bottom: 8px;
        background: #fafafa;
        border: 1px solid #dbdbdb;
        border-radius: 3px;
        font-size: 12px;
    }

    form label {
        display: none;
        /* Hides labels for a cleaner look if using placeholders */
    }

    .btn-signup {
        background-color: #0095f6;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: 600;
        padding: 5px 0;
        margin-top: 10px;
    }

    .btn-signup:hover {
        background-color: #1877f2;
    }

    .login-box {
        border: 1px solid #dbdbdb;
        background-color: #fff;
        padding: 20px;
        margin-top: 10px;
        font-size: 14px;
    }
</style>

<div class="row justify-content-center auth-container">
    <div class="col-md-4">
        <div class="card auth-card text-center shadow-sm">
            <div class="card-body">
                <h1 class="brand-logo">PixelGram</h1>
                <p class="text-muted fw-bold mb-4" style="font-size: 17px; line-height: 20px;">
                    Sign up to see photos and videos from your friends.
                </p>

                <form method="post" enctype="multipart/form-data" class="text-start">
                    {% csrf_token %}

                    <div class="mb-2">
                        {{ u_form }}
                    </div>

                    <div class="pfp-section text-center p-3 my-3"
                        style="background: #fafafa; border: 1px dashed #dbdbdb; border-radius: 8px;">
                        <p class="text-muted small fw-bold mb-2">Profile Picture (Optional)</p>
                        {{ p_form }}
                    </div>

                    <div class="d-grid mt-3">
                        <button class="btn btn-signup" type="submit">Sign Up</button>
                    </div>
                </form>

                <p class="text-muted small mt-3" style="font-size: 12px;">
                    By signing up, you agree to our <strong>Terms, Privacy Policy</strong> and <strong>Cookies
                        Policy</strong>.
                </p>
            </div>
        </div>

        <div class="login-box text-center shadow-sm">
            <p class="mb-0">Have an account? <a href="{% url 'login' %}"
                    style="text-decoration: none; font-weight: 600; color: #0095f6;">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
